name: Track flight prices

on:
  schedule:
    - cron: "17 * * * *" # every hour, at minute 17 to avoid the top-of-hour rush
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Only send a test Telegram message"
        type: boolean
        default: false

concurrency:
  group: track
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # state.json remembers which deals were already sent
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Send test message
        if: ${{ inputs.test_notify }}
        run: python tracker.py --test-notify

      - name: Check prices
        if: ${{ !inputs.test_notify }}
        run: python tracker.py

      - uses: actions/cache/save@v4
        if: ${{ always() && !inputs.test_notify && hashFiles('state.json') != '' }}
        with:
          path: state.json
          key: state-${{ github.run_id }}
